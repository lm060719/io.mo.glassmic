name: 构建正式签名 APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # 同步到模块仓库后不重复构建，也不向镜像仓库提供签名材料。
    if: github.repository == 'lm060719/io.mo.glassmic'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: 检出本次提交
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 配置 Java 17 和 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: |
            17
            21
          cache: gradle

      - name: 配置 Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false

      - name: 安装项目要求的 SDK 和原生工具链
        run: sdkmanager "platforms;android-35" "platforms;android-37.0" "build-tools;36.0.0" "cmake;3.22.1" "ndk;26.1.10909125"

      - name: 编译诊断检查类及 Release 安装包
        run: bash ./gradlew :app:compileDebugKotlin :xposed:compileDebugKotlin :app:assembleRelease --no-daemon --console=plain

      - name: 执行回归检查（tests/ 下的 JVM 回归，经 Gradle 单元测试运行）
        run: bash ./gradlew :app:testDebugUnitTest --no-daemon --console=plain

      - name: 使用正式密钥签名并验证安装包
        # PR 只做构建与回归检查；签名材料只在 main 上使用。
        if: github.event_name != 'pull_request'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"
          umask 077
          keystore=$(mktemp "$RUNNER_TEMP/glassmic-signing-XXXXXX")
          trap 'rm -f "$keystore"' EXIT
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore"
          version=$(python3 -c 'import json; print(json.load(open("app/build/outputs/apk/release/output-metadata.json"))["elements"][0]["versionName"])')
          version_code=$(python3 -c 'import json; print(json.load(open("app/build/outputs/apk/release/output-metadata.json"))["elements"][0]["versionCode"])')
          tools="$ANDROID_HOME/build-tools/36.0.0"
          mkdir -p dist
          apk="dist/GlassMic-$version-release.apk"
          "$tools/zipalign" -P 16 -f 4 app/build/outputs/apk/release/app-release-unsigned.apk "$RUNNER_TEMP/glassmic-aligned.apk"
          "$tools/apksigner" sign --ks "$keystore" --ks-key-alias "$ANDROID_KEY_ALIAS" --ks-pass env:ANDROID_KEYSTORE_PASSWORD --key-pass env:ANDROID_KEY_PASSWORD --v4-signing-enabled false --out "$apk" "$RUNNER_TEMP/glassmic-aligned.apk"
          "$tools/apksigner" verify --verbose --print-certs "$apk" > dist/signature.txt
          grep -F 'Signer #1 certificate SHA-256 digest: 20e354f32bda7574dcc747150e4f5a267a2d3bca50eb4656a3be7380cd4f96bc' dist/signature.txt
          "$tools/zipalign" -c -P 16 4 "$apk"
          (cd dist && sha256sum "GlassMic-$version-release.apk" > SHA256SUMS.txt)
          printf 'versionName=%s\nversionCode=%s\ncommit=%s\nworkflow=%s/%s/actions/runs/%s\n' "$version" "$version_code" "$GITHUB_SHA" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" > dist/build-info.txt

      - name: 上传正式安装包、签名信息与校验值
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: GlassMic-signed-release-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 30

  native-regression:
    # pcm_regression.cpp 直接编译 glass_aaudio.cpp（替换掉 Android 头文件），需要 MSVC。
    if: github.repository == 'lm060719/io.mo.glassmic'
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - name: 检出本次提交
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 编译并运行 native PCM 回归
        shell: pwsh
        run: ./tests/native/run.ps1
